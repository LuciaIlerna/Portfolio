<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header id="cabecera-principal">
        <div class="logo">José Luis & Lucía</div>
        <nav class="menu-nav">
            <ul>
                <li><a href="index.html">Proyectos</a></li>
                <li><a href="aboutme.html">Sobre mí</a></li>
                <li><a href="skills.html">Habilidades</a></li>
                <li><a href="contacto.html" class="activo">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contenedor">
            <div class="grid-contacto">
                <div class="informacion-contacto">
                    <span class="etiqueta-destacada">Hablemos</span>
                    <h1>Contacto</h1>
                    <p>Si quieres preguntarme por alguno de mis proyectos o proponer una colaboración, puedes escribirme.</p>
                    <p><strong>Email:</strong> <a href="mailto:joseluissanchezz@alumnos.alborfp.com">joseluissanchezz@alumnos.alborfp.com</a></p>
                </div>

                <form class="formulario-contacto" action="#" method="post">
                    <div class="campo-formulario">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="campo-formulario">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-primario">Enviar mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer id="footer">
        <p>2026 — José Luis</p>
        <div class="enlaces-sociales">
            <a href="https://github.com" target="_blank">GitHub</a>
            <a href="mailto:joseluissanchezz@alumnos.alborfp.com">Correo</a>
        </div>
    </footer>
</body>
</html>
